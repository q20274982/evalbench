services:
  app:
    build: .
    working_dir: /work
    volumes:
      - .:/work              # 程式碼與 data/,在 host 編輯、容器裡執行
      - uv-cache:/cache/uv   # uv 的下載快取,重跑不用重抓
      - venv:/venv           # 虛擬環境留在容器內,不落到 bind mount 上
    env_file:
      - .env
    stdin_open: true
    tty: true

  # W1 §3 環境前置第二項。只放 case 表——trace 定案存檔案,不進 DB(W1 工作簿 §3)。
  # 映像用 pgvector 版(= 官方 postgres:17 + vector 擴充),W2 的向量檢索直接用得上,
  # 不必到 W2 才換映像。擴充要 CREATE EXTENSION 才生效,W1 不啟用。
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"        # 從 host 用 psql / GUI 看表用的
    volumes:
      - pgdata:/var/lib/postgresql/data   # 持久化:容器砍掉重建,資料還在

  # Demo 站(過渡版,Calvin 2026-11-10)。純靜態檔,不連 db、不呼叫模型。
  # 資料先用 `docker compose run --rm app uv run python web/export_demo.py` 匯出,
  # 再 `docker compose up -d demo`,開 http://localhost:8080
  demo:
    image: nginx:1.27-alpine
    volumes:
      - ./web/site:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  uv-cache:
  venv:
  pgdata:
